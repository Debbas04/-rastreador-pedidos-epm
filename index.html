<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rastreador de Pedidos - EPM</title>
<style>
  :root {
    --bg: #0d0d0d;
    --card: #1a1a1a;
    --card-hover: #212121;
    --border: #2c2c2c;
    --text: #e8e6e2;
    --text-muted: #8f8c86;
    --amber-bg: #2a2110;
    --amber-text: #e0a83c;
    --amber-border: #4a3a16;
    --blue-bg: #101d2a;
    --blue-text: #5b9bd9;
    --blue-border: #1c3550;
    --green-bg: #10240f;
    --green-text: #6fc25a;
    --green-border: #1e3d1a;
    --red-bg: #2a1212;
    --red-text: #f16d6d;
    --red-border: #4a1c1c;
    --accent: #dc2626;
    --accent-hover: #b91c1c;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    padding: 16px;
    max-width: 720px;
    margin: 0 auto;
    padding-bottom: 80px;
  }
  h1 {
    font-size: 20px;
    font-weight: 600;
    margin: 8px 0 4px;
    letter-spacing: -0.01em;
  }
  .subtitle {
    color: var(--text-muted);
    font-size: 13px;
    margin-bottom: 16px;
  }
  .stats {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 8px;
    margin-bottom: 16px;
  }
  .stat {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 10px 6px;
    text-align: center;
  }
  .stat .num { font-size: 18px; font-weight: 700; }
  .stat .lbl { font-size: 10px; color: var(--text-muted); margin-top: 2px; }
  .stat.alert .num { color: var(--red-text); }

  .toolbar {
    display: flex;
    gap: 8px;
    margin-bottom: 16px;
  }
  .toolbar input[type=text] {
    flex: 1;
    padding: 10px 12px;
    border-radius: 8px;
    border: 1px solid var(--border);
    font-size: 14px;
    background: var(--card);
    color: var(--text);
  }
  .toolbar input[type=text]::placeholder { color: var(--text-muted); }
  .toolbar input[type=text]:focus { outline: none; border-color: var(--accent); }

  button {
    cursor: pointer;
    border: none;
    font-family: inherit;
  }
  .btn-primary {
    background: var(--accent);
    color: white;
    padding: 10px 16px;
    border-radius: 8px;
    font-size: 14px;
    font-weight: 600;
    white-space: nowrap;
  }
  .btn-primary:active { background: var(--accent-hover); }

  .filters {
    display: flex;
    gap: 6px;
    margin-bottom: 14px;
    overflow-x: auto;
    padding-bottom: 2px;
  }
  .chip {
    padding: 6px 12px;
    border-radius: 20px;
    border: 1px solid var(--border);
    background: var(--card);
    font-size: 12px;
    color: var(--text-muted);
    white-space: nowrap;
  }
  .chip.active {
    background: var(--text);
    color: var(--bg);
    border-color: var(--text);
  }

  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 14px;
    margin-bottom: 10px;
    position: relative;
  }
  .card.late { border-color: var(--red-border); background: linear-gradient(180deg, rgba(220,38,38,0.06), rgba(220,38,38,0) 40%), var(--card); }
  .card-top {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 8px;
  }
  .card-supplier { font-size: 15px; font-weight: 600; margin: 0 0 6px; }
  .card-itens { margin: 0 0 4px; }
  .card-item-line {
    font-size: 13px;
    color: var(--text);
    padding: 2px 0;
  }
  .card-item-line .qtd { color: var(--text-muted); margin-right: 4px; }
  .badge {
    font-size: 11px;
    font-weight: 600;
    padding: 3px 9px;
    border-radius: 20px;
    white-space: nowrap;
  }
  .badge.pedido { background: var(--amber-bg); color: var(--amber-text); }
  .badge.entregue { background: var(--blue-bg); color: var(--blue-text); }
  .badge.nf { background: var(--green-bg); color: var(--green-text); }
  .badge.late-tag {
    background: var(--red-bg); color: var(--red-text);
    border: 1px solid var(--red-border);
  }

  .card-meta {
    font-size: 12px;
    color: var(--text-muted);
    margin-top: 10px;
    display: flex;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 4px;
  }
  .previsao {
    font-size: 12px;
    color: var(--text-muted);
    margin-top: 4px;
  }
  .previsao.venceu { color: var(--red-text); }

  .nf-row {
    margin-top: 10px;
    padding-top: 10px;
    border-top: 1px solid var(--border);
    display: flex;
    gap: 8px;
    align-items: center;
    flex-wrap: wrap;
  }
  .nf-row input[type=text] {
    flex: 1;
    min-width: 110px;
    padding: 7px 10px;
    border-radius: 6px;
    border: 1px solid var(--border);
    font-size: 13px;
    background: var(--bg);
    color: var(--text);
  }
  .toggle-lancado {
    font-size: 12px;
    font-weight: 600;
    padding: 6px 10px;
    border-radius: 6px;
    border: 1px solid var(--border);
    background: var(--bg);
    color: var(--text-muted);
  }
  .toggle-lancado.on {
    background: var(--green-bg);
    color: var(--green-text);
    border-color: var(--green-border);
  }

  .actions {
    display: flex;
    gap: 8px;
    margin-top: 10px;
    flex-wrap: wrap;
  }
  .actions button {
    font-size: 12px;
    padding: 7px 12px;
    border-radius: 6px;
    border: 1px solid var(--border);
    background: var(--bg);
    color: var(--text);
  }
  .actions button.danger { color: var(--red-text); border-color: var(--red-border); }
  .actions button.primary-ghost { color: var(--accent); border-color: var(--red-border); }

  .empty {
    text-align: center;
    color: var(--text-muted);
    padding: 40px 20px;
    font-size: 14px;
  }

  .modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.6);
    display: none;
    align-items: flex-end;
    justify-content: center;
    z-index: 50;
  }
  .modal-overlay.open { display: flex; }
  .modal {
    background: var(--card);
    width: 100%;
    max-width: 480px;
    border-radius: 16px 16px 0 0;
    padding: 20px;
    max-height: 88vh;
    overflow-y: auto;
    border: 1px solid var(--border);
    border-bottom: none;
  }
  .modal h2 { font-size: 16px; margin: 0 0 14px; }
  .field { margin-bottom: 12px; }
  .field label {
    display: block;
    font-size: 12px;
    color: var(--text-muted);
    margin-bottom: 4px;
    font-weight: 600;
  }
  .field input, .field textarea {
    width: 100%;
    padding: 10px 12px;
    border-radius: 8px;
    border: 1px solid var(--border);
    font-size: 14px;
    font-family: inherit;
    background: var(--bg);
    color: var(--text);
  }
  .field input:focus { outline: none; border-color: var(--accent); }

  .itens-lista { margin-bottom: 10px; }
  .item-row {
    display: grid;
    grid-template-columns: 60px 90px 1fr auto;
    gap: 6px;
    margin-bottom: 8px;
    align-items: center;
  }
  .item-row input {
    padding: 8px 8px;
    border-radius: 6px;
    border: 1px solid var(--border);
    background: var(--bg);
    color: var(--text);
    font-size: 13px;
    width: 100%;
  }
  .item-row input:focus { outline: none; border-color: var(--accent); }
  .item-remove {
    background: var(--red-bg);
    color: var(--red-text);
    border: 1px solid var(--red-border);
    border-radius: 6px;
    width: 30px;
    height: 30px;
    font-size: 16px;
    line-height: 1;
  }
  .btn-add-item {
    background: var(--bg);
    border: 1px dashed var(--border);
    color: var(--text-muted);
    padding: 8px 12px;
    border-radius: 8px;
    font-size: 13px;
    width: 100%;
    margin-bottom: 12px;
  }

  .modal-actions {
    display: flex;
    gap: 8px;
    margin-top: 16px;
  }
  .modal-actions button { flex: 1; padding: 12px; border-radius: 8px; font-size: 14px; font-weight: 600; }
  .btn-cancel { background: var(--bg); border: 1px solid var(--border); color: var(--text); }

  .err { color: var(--red-text); font-size: 12px; margin-top: 4px; display: none; }

  .seg-control {
    display: flex;
    gap: 6px;
  }
  .seg-btn {
    flex: 1;
    padding: 9px 8px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: var(--bg);
    color: var(--text-muted);
    font-size: 13px;
    font-weight: 600;
  }
  .seg-btn.on {
    background: var(--accent);
    color: white;
    border-color: var(--accent);
  }

  .venc-tag {
    background: var(--red-bg); color: var(--red-text);
    border: 1px solid var(--red-border);
  }
  .info-pill {
    font-size: 11px;
    color: var(--text-muted);
    background: var(--bg);
    border: 1px solid var(--border);
    padding: 2px 8px;
    border-radius: 20px;
  }

  .hist-list { margin-top: 6px; }
  .hist-line {
    font-size: 13px;
    color: var(--text-muted);
    padding: 6px 0;
    border-bottom: 1px solid var(--border);
    display: flex;
    justify-content: space-between;
  }
  .hist-line:last-child { border-bottom: none; }
  .hist-line .status-nome { color: var(--text); font-weight: 600; }
</style>
</head>
<body>

<h1>Rastreador de pedidos - EPM</h1>
<p class="subtitle">Pedido &rarr; Entregue &rarr; NF recebida</p>

<div class="stats" id="stats"></div>

<div class="toolbar">
  <input type="text" id="search" placeholder="Buscar fornecedor ou item">
  <button class="btn-primary" onclick="openModal()">+ Novo</button>
</div>

<div class="filters" id="filters"></div>

<div id="list"></div>

<div class="modal-overlay" id="modalOverlay">
  <div class="modal">
    <h2 id="modalTitulo">Novo pedido</h2>
    <div class="field">
      <label>Fornecedor</label>
      <input type="text" id="f-fornecedor" placeholder="Ex: Fornecedor A">
    </div>

    <div class="field">
      <label>Itens do pedido</label>
      <div class="itens-lista" id="itensLista"></div>
      <button type="button" class="btn-add-item" onclick="adicionarLinhaItem()">+ Adicionar item</button>
    </div>

    <div class="field">
      <label>Previsão de entrega (opcional)</label>
      <input type="date" id="f-previsao">
    </div>

    <div class="field">
      <label>Onde está a nota fiscal</label>
      <div class="seg-control" id="segOrigem">
        <button type="button" class="seg-btn" data-valor="whatsapp" onclick="selecionarOrigem('whatsapp')">WhatsApp</button>
        <button type="button" class="seg-btn" data-valor="email" onclick="selecionarOrigem('email')">E-mail</button>
      </div>
    </div>

    <div class="field">
      <label>Forma de pagamento</label>
      <div class="seg-control" id="segPagamento">
        <button type="button" class="seg-btn" data-valor="boleto" onclick="selecionarPagamento('boleto')">Boleto</button>
        <button type="button" class="seg-btn" data-valor="pix" onclick="selecionarPagamento('pix')">Pix / dados bancários</button>
      </div>
    </div>

    <div class="field" id="campoVencimento" style="display:none;">
      <label>Vencimento do boleto</label>
      <input type="date" id="f-vencimento">
    </div>

    <div class="err" id="f-err">Preencha fornecedor e pelo menos um item.</div>
    <div class="modal-actions">
      <button class="btn-cancel" onclick="closeModal()">Cancelar</button>
      <button class="btn-primary" id="btnSalvarModal" onclick="salvarPedido()" style="flex:1;">Salvar pedido</button>
    </div>
  </div>
</div>

<div class="modal-overlay" id="histOverlay">
  <div class="modal">
    <h2>Histórico do pedido</h2>
    <div class="hist-list" id="histLista"></div>
    <div class="modal-actions">
      <button class="btn-cancel" onclick="closeHist()" style="flex:1;">Fechar</button>
    </div>
  </div>
</div>

<script type="module">
// ===== CONFIGURACAO DO FIREBASE =====
const firebaseConfig = {
  apiKey: "AIzaSyA8-yk9emSNXNsKMgDNIsxeUUv9pghhPMg",
  authDomain: "epm-pedidos.firebaseapp.com",
  projectId: "epm-pedidos",
  storageBucket: "epm-pedidos.firebasestorage.app",
  messagingSenderId: "809353955527",
  appId: "1:809353955527:web:09d35b99c5a6322e83d6e2"
};
// =====================================

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import {
  getFirestore, collection, doc, setDoc, deleteDoc, onSnapshot
} from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const pedidosCol = collection(db, "pedidos-epm");

let pedidos = [];
let filtroAtual = 'ativos';
let editandoId = null;
let itemCounter = 0;

const STATUS = {
  pedido: { label: 'Pedido feito', cls: 'pedido' },
  entregue: { label: 'Entregue', cls: 'entregue' },
  nf: { label: 'NF recebida', cls: 'nf' }
};

onSnapshot(pedidosCol, (snapshot) => {
  pedidos = snapshot.docs.map(d => ({ id: d.id, ...d.data() }));
  render();
}, (err) => {
  console.error('Erro ao sincronizar', err);
  document.getElementById('list').innerHTML =
    '<div class="empty">Não foi possível conectar ao banco de dados. Confira a configuração do Firebase.</div>';
});

async function salvarNoFirestore(p) {
  try {
    const { id, ...dados } = p;
    await setDoc(doc(db, "pedidos-epm", id), dados);
  } catch (e) {
    console.error('Erro ao salvar', e);
  }
}

async function excluirDoFirestore(id) {
  try {
    await deleteDoc(doc(db, "pedidos-epm", id));
  } catch (e) {
    console.error('Erro ao excluir', e);
  }
}

function diasDesde(iso) {
  return Math.floor((Date.now() - new Date(iso).getTime()) / 86400000);
}

function estaAtrasado(p) {
  if (p.arquivado) return false;
  if (!p.lancado) {
    const hoje = new Date().toISOString().slice(0, 10);
    if (p.pagamento === 'boleto' && p.vencimento) {
      if (p.vencimento < hoje) return true;
      const quartaIdeal = quartaFeiraAnteriorOuIgual(somarDias(p.vencimento, -15));
      if (quartaIdeal < hoje) return true;
    }
  }
  return diasDesde(p.statusDesde) >= 3;
}

function formatarData(iso) {
  if (!iso) return '';
  const [ano, mes, dia] = iso.split('-');
  return `${dia}/${mes}/${ano}`;
}

function formatarDataHora(iso) {
  const d = new Date(iso);
  return d.toLocaleDateString('pt-BR') + ' ' + d.toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' });
}

// Retorna a quarta-feira mais próxima igual ou anterior a uma data (YYYY-MM-DD)
function quartaFeiraAnteriorOuIgual(dataISO) {
  const d = new Date(dataISO + 'T12:00:00');
  const diaSemana = d.getDay(); // 0=dom, 3=qua
  let diff;
  if (diaSemana >= 3) diff = diaSemana - 3;
  else diff = diaSemana + 4;
  d.setDate(d.getDate() - diff);
  return d.toISOString().slice(0, 10);
}

// Retorna a próxima quarta-feira igual ou posterior a hoje
function proximaQuartaFeira() {
  const hoje = new Date();
  const diaSemana = hoje.getDay();
  let diff = (3 - diaSemana + 7) % 7;
  const d = new Date(hoje);
  d.setDate(d.getDate() + diff);
  return d.toISOString().slice(0, 10);
}

function somarDias(dataISO, dias) {
  const d = new Date(dataISO + 'T12:00:00');
  d.setDate(d.getDate() + dias);
  return d.toISOString().slice(0, 10);
}

// ===== MODAL DE ITENS =====
function linhaItemHTML(item) {
  const uid = item.uid;
  return `
    <div class="item-row" data-uid="${uid}">
      <input type="text" placeholder="Qtd" value="${item.qtd || ''}" data-campo="qtd">
      <input type="text" placeholder="Unidade" value="${item.unidade || ''}" data-campo="unidade">
      <input type="text" placeholder="Descrição (ex: cimento CP-II)" value="${(item.descricao || '').replace(/"/g,'&quot;')}" data-campo="descricao">
      <button type="button" class="item-remove" onclick="removerLinhaItem('${uid}')">×</button>
    </div>
  `;
}

window.adicionarLinhaItem = function(item) {
  const uid = item?.uid ?? ('it' + (itemCounter++));
  const novoItem = { uid, qtd: item?.qtd || '', unidade: item?.unidade || '', descricao: item?.descricao || '' };
  const wrapper = document.createElement('div');
  wrapper.innerHTML = linhaItemHTML(novoItem);
  document.getElementById('itensLista').appendChild(wrapper.firstElementChild);
}

window.removerLinhaItem = function(uid) {
  const el = document.querySelector(`.item-row[data-uid="${uid}"]`);
  if (el) el.remove();
}

function lerItensDoModal() {
  const linhas = document.querySelectorAll('#itensLista .item-row');
  const itens = [];
  linhas.forEach(linha => {
    const qtd = linha.querySelector('[data-campo=qtd]').value.trim();
    const unidade = linha.querySelector('[data-campo=unidade]').value.trim();
    const descricao = linha.querySelector('[data-campo=descricao]').value.trim();
    if (descricao) itens.push({ qtd, unidade, descricao });
  });
  return itens;
}

let origemSelecionada = '';
let pagamentoSelecionado = '';

window.selecionarOrigem = function(valor) {
  origemSelecionada = origemSelecionada === valor ? '' : valor;
  document.querySelectorAll('#segOrigem .seg-btn').forEach(b => {
    b.classList.toggle('on', b.dataset.valor === origemSelecionada);
  });
}

window.selecionarPagamento = function(valor) {
  pagamentoSelecionado = pagamentoSelecionado === valor ? '' : valor;
  document.querySelectorAll('#segPagamento .seg-btn').forEach(b => {
    b.classList.toggle('on', b.dataset.valor === pagamentoSelecionado);
  });
  document.getElementById('campoVencimento').style.display = pagamentoSelecionado === 'boleto' ? 'block' : 'none';
}

// ===== MODAL PRINCIPAL =====
window.openModal = function(id) {
  editandoId = id || null;
  const p = editandoId ? pedidos.find(x => x.id === editandoId) : null;

  document.getElementById('f-fornecedor').value = p ? p.fornecedor : '';
  document.getElementById('f-previsao').value = p ? (p.previsao || '') : '';
  document.getElementById('f-err').style.display = 'none';
  document.getElementById('modalTitulo').textContent = p ? 'Editar pedido' : 'Novo pedido';
  document.getElementById('btnSalvarModal').textContent = p ? 'Salvar alterações' : 'Salvar pedido';

  document.getElementById('itensLista').innerHTML = '';
  if (p && p.itens && p.itens.length) {
    p.itens.forEach(it => adicionarLinhaItem(it));
  } else {
    adicionarLinhaItem();
  }

  origemSelecionada = p ? (p.origemNota || '') : '';
  pagamentoSelecionado = p ? (p.pagamento || '') : '';
  document.querySelectorAll('#segOrigem .seg-btn').forEach(b => {
    b.classList.toggle('on', b.dataset.valor === origemSelecionada);
  });
  document.querySelectorAll('#segPagamento .seg-btn').forEach(b => {
    b.classList.toggle('on', b.dataset.valor === pagamentoSelecionado);
  });
  document.getElementById('f-vencimento').value = p ? (p.vencimento || '') : '';
  document.getElementById('campoVencimento').style.display = pagamentoSelecionado === 'boleto' ? 'block' : 'none';

  document.getElementById('modalOverlay').classList.add('open');
}
window.closeModal = function() {
  document.getElementById('modalOverlay').classList.remove('open');
  editandoId = null;
}

window.salvarPedido = function() {
  const fornecedor = document.getElementById('f-fornecedor').value.trim();
  const previsao = document.getElementById('f-previsao').value;
  const vencimento = pagamentoSelecionado === 'boleto' ? document.getElementById('f-vencimento').value : '';
  const itens = lerItensDoModal();

  if (!fornecedor || itens.length === 0) {
    document.getElementById('f-err').style.display = 'block';
    return;
  }

  if (editandoId) {
    const p = pedidos.find(x => x.id === editandoId);
    if (p) {
      p.fornecedor = fornecedor;
      p.itens = itens;
      p.previsao = previsao;
      p.origemNota = origemSelecionada;
      p.pagamento = pagamentoSelecionado;
      p.vencimento = vencimento;
      salvarNoFirestore(p);
    }
  } else {
    const now = new Date().toISOString();
    const novo = {
      id: 'p' + Date.now(),
      fornecedor,
      itens,
      previsao,
      origemNota: origemSelecionada,
      pagamento: pagamentoSelecionado,
      vencimento,
      status: 'pedido',
      statusDesde: now,
      criadoEm: now,
      nf: '',
      lancado: false,
      arquivado: false,
      historico: [{ status: 'pedido', data: now }]
    };
    salvarNoFirestore(novo);
  }
  closeModal();
}

// ===== HISTÓRICO =====
window.abrirHistorico = function(id) {
  const p = pedidos.find(x => x.id === id);
  if (!p) return;
  const hist = p.historico && p.historico.length ? p.historico : [{ status: p.status, data: p.statusDesde }];
  document.getElementById('histLista').innerHTML = hist.map(h => `
    <div class="hist-line">
      <span class="status-nome">${STATUS[h.status]?.label || h.status}</span>
      <span>${formatarDataHora(h.data)}</span>
    </div>
  `).join('');
  document.getElementById('histOverlay').classList.add('open');
}
window.closeHist = function() {
  document.getElementById('histOverlay').classList.remove('open');
}

// ===== AÇÕES DE STATUS =====
function registrarHistorico(p) {
  if (!p.historico) p.historico = [];
  p.historico.push({ status: p.status, data: p.statusDesde });
}

window.avancarStatus = function(id) {
  const p = pedidos.find(x => x.id === id);
  if (!p) return;
  const ordem = ['pedido', 'entregue', 'nf'];
  const i = ordem.indexOf(p.status);
  if (i < ordem.length - 1) {
    p.status = ordem[i + 1];
    p.statusDesde = new Date().toISOString();
    registrarHistorico(p);
  }
  salvarNoFirestore(p);
}

window.voltarStatus = function(id) {
  const p = pedidos.find(x => x.id === id);
  if (!p) return;
  const ordem = ['pedido', 'entregue', 'nf'];
  const i = ordem.indexOf(p.status);
  if (i > 0) {
    p.status = ordem[i - 1];
    p.statusDesde = new Date().toISOString();
    registrarHistorico(p);
  }
  salvarNoFirestore(p);
}

window.atualizarNF = function(id, valor) {
  const p = pedidos.find(x => x.id === id);
  if (!p) return;
  p.nf = valor;
  salvarNoFirestore(p);
}

window.toggleLancado = function(id) {
  const p = pedidos.find(x => x.id === id);
  if (!p) return;
  p.lancado = !p.lancado;
  salvarNoFirestore(p);
}

window.arquivar = function(id) {
  const p = pedidos.find(x => x.id === id);
  if (!p) return;
  p.arquivado = true;
  salvarNoFirestore(p);
}

window.excluir = function(id) {
  excluirDoFirestore(id);
}

window.setFiltro = function(f) {
  filtroAtual = f;
  render();
}

// ===== RENDER =====
function render() {
  const total = pedidos.filter(p => !p.arquivado).length;
  const atrasados = pedidos.filter(p => estaAtrasado(p)).length;
  const nf = pedidos.filter(p => p.status === 'nf' && !p.arquivado).length;
  const emAndamento = pedidos.filter(p => p.status !== 'nf' && !p.arquivado).length;

  document.getElementById('stats').innerHTML = `
    <div class="stat"><div class="num">${total}</div><div class="lbl">total</div></div>
    <div class="stat"><div class="num">${emAndamento}</div><div class="lbl">em andamento</div></div>
    <div class="stat"><div class="num">${nf}</div><div class="lbl">concluidos</div></div>
    <div class="stat ${atrasados > 0 ? 'alert' : ''}"><div class="num">${atrasados}</div><div class="lbl">atrasados</div></div>
  `;

  const filtros = [
    { id: 'ativos', label: 'Ativos' },
    { id: 'pedido', label: 'Pedido feito' },
    { id: 'entregue', label: 'Entregue' },
    { id: 'nf', label: 'NF recebida' },
    { id: 'arquivados', label: 'Arquivados' }
  ];
  document.getElementById('filters').innerHTML = filtros.map(f =>
    `<button class="chip ${filtroAtual === f.id ? 'active' : ''}" onclick="setFiltro('${f.id}')">${f.label}</button>`
  ).join('');

  let lista = pedidos;
  if (filtroAtual === 'ativos') lista = lista.filter(p => !p.arquivado);
  else if (filtroAtual === 'arquivados') lista = lista.filter(p => p.arquivado);
  else lista = lista.filter(p => p.status === filtroAtual && !p.arquivado);

  const busca = document.getElementById('search').value.trim().toLowerCase();
  if (busca) {
    lista = lista.filter(p => {
      const itensTexto = (p.itens || []).map(it => it.descricao).join(' ').toLowerCase();
      return p.fornecedor.toLowerCase().includes(busca) || itensTexto.includes(busca);
    });
  }

  lista = lista.slice().sort((a, b) => new Date(b.criadoEm) - new Date(a.criadoEm));

  const listEl = document.getElementById('list');
  if (lista.length === 0) {
    listEl.innerHTML = `<div class="empty">Nenhum pedido aqui ainda.</div>`;
    return;
  }

  const hoje = new Date().toISOString().slice(0, 10);

  listEl.innerHTML = lista.map(p => {
    const atrasado = estaAtrasado(p);
    const dias = diasDesde(p.statusDesde);
    const st = STATUS[p.status];
    const ordem = ['pedido', 'entregue', 'nf'];
    const idx = ordem.indexOf(p.status);
    const podeAvancar = idx < ordem.length - 1 && !p.arquivado;
    const podeVoltar = idx > 0 && !p.arquivado;

    const itensHTML = (p.itens || []).map(it => `
      <div class="card-item-line">${it.qtd ? `<span class="qtd">${it.qtd}${it.unidade ? ' ' + it.unidade : ''}</span>` : ''}${it.descricao}</div>
    `).join('');

    let previsaoHTML = '';
    if (p.previsao) {
      const venceu = p.previsao < hoje && p.status !== 'nf';
      previsaoHTML = `<div class="previsao ${venceu ? 'venceu' : ''}">Previsão: ${formatarData(p.previsao)}${venceu ? ' (vencida)' : ''}</div>`;
    }

    let infoPagtoHTML = '';
    const origemLabel = { whatsapp: 'WhatsApp', email: 'E-mail' }[p.origemNota] || '';
    const pagtoLabel = { boleto: 'Boleto', pix: 'Pix/dados bancários' }[p.pagamento] || '';
    if (origemLabel || pagtoLabel) {
      infoPagtoHTML = `<div class="card-meta" style="margin-top:6px;">
        ${origemLabel ? `<span class="info-pill">Nota: ${origemLabel}</span>` : ''}
        ${pagtoLabel ? `<span class="info-pill">${pagtoLabel}</span>` : ''}
      </div>`;
    }

    let vencimentoAlertaHTML = '';
    if (p.pagamento === 'boleto' && p.vencimento && !p.lancado) {
      const boletoVenceu = p.vencimento < hoje;
      const diasParaVencer = Math.ceil((new Date(p.vencimento) - new Date(hoje)) / 86400000);
      if (boletoVenceu) {
        vencimentoAlertaHTML = `<div class="card-meta" style="margin-top:6px;"><span class="badge venc-tag">Boleto vencido em ${formatarData(p.vencimento)}</span></div>`;
      } else if (diasParaVencer <= 15) {
        vencimentoAlertaHTML = `<div class="card-meta" style="margin-top:6px;"><span class="badge venc-tag">Vence em ${formatarData(p.vencimento)}</span></div>`;
      } else {
        vencimentoAlertaHTML = `<div class="previsao">Boleto vence em ${formatarData(p.vencimento)}</div>`;
      }
    }

    let lancamentoHTML = '';
    if (!p.lancado) {
      if (p.pagamento === 'boleto' && p.vencimento) {
        const quartaIdeal = quartaFeiraAnteriorOuIgual(somarDias(p.vencimento, -15));
        const prazoPerdido = quartaIdeal < hoje;
        if (prazoPerdido) {
          lancamentoHTML = `<div class="card-meta" style="margin-top:6px;"><span class="badge venc-tag">Prazo de lançamento vencido (era ${formatarData(quartaIdeal)}) — lance com urgência</span></div>`;
        } else {
          lancamentoHTML = `<div class="previsao">Lançar na quarta-feira: ${formatarData(quartaIdeal)}</div>`;
        }
      } else if (p.pagamento === 'pix') {
        const quarta = proximaQuartaFeira();
        lancamentoHTML = `<div class="previsao">Lançar na quarta-feira: ${formatarData(quarta)}</div>`;
      }
    }

    let nfRow = '';
    if (p.status === 'nf') {
      nfRow = `
        <div class="nf-row">
          <input type="text" placeholder="Número da NF" value="${(p.nf || '').replace(/"/g,'&quot;')}"
            onchange="atualizarNF('${p.id}', this.value)">
          <button class="toggle-lancado ${p.lancado ? 'on' : ''}" onclick="toggleLancado('${p.id}')">
            ${p.lancado ? 'Lançado no sistema' : 'Pendente lançamento'}
          </button>
        </div>
      `;
    }

    const btnEditar = `<button onclick="openModal('${p.id}')">Editar</button>`;
    const btnHist = `<button onclick="abrirHistorico('${p.id}')">Histórico</button>`;

    let actions = '';
    if (!p.arquivado) {
      actions = `<div class="actions">
        ${btnEditar}
        ${btnHist}
        ${podeVoltar ? `<button onclick="voltarStatus('${p.id}')">Voltar etapa</button>` : ''}
        ${podeAvancar ? `<button class="primary-ghost" onclick="avancarStatus('${p.id}')">Avançar etapa</button>` : ''}
        ${p.status === 'nf' ? `<button onclick="arquivar('${p.id}')">Arquivar</button>` : ''}
        <button class="danger" onclick="excluir('${p.id}')">Excluir</button>
      </div>`;
    } else {
      actions = `<div class="actions">
        ${btnEditar}
        ${btnHist}
        <button class="danger" onclick="excluir('${p.id}')">Excluir</button>
      </div>`;
    }

    return `
      <div class="card ${atrasado ? 'late' : ''}">
        <div class="card-top">
          <div>
            <p class="card-supplier">${p.fornecedor}</p>
            <div class="card-itens">${itensHTML}</div>
            ${previsaoHTML}
            ${infoPagtoHTML}
            ${vencimentoAlertaHTML}
            ${lancamentoHTML}
          </div>
          <span class="badge ${st.cls}">${st.label}</span>
        </div>
        ${nfRow}
        <div class="card-meta">
          <span>${dias === 0 ? 'Hoje' : dias + (dias === 1 ? ' dia' : ' dias') + ' nesta etapa'}</span>
          ${atrasado ? '<span class="badge late-tag">Atrasado</span>' : ''}
        </div>
        ${actions}
      </div>
    `;
  }).join('');
}

document.getElementById('search').addEventListener('input', render);
</script>

</body>
</html>
